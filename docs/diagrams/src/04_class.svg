<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L11,6 L0,12" fill="none" stroke="#333" stroke-width="1.6"/>
    </marker>
    <marker id="diamond" viewBox="0 0 20 12" refX="1" refY="6" markerWidth="18" markerHeight="11" orient="auto-start-reverse">
      <path d="M1,6 L10,1 L19,6 L10,11 z" fill="#fff" stroke="#333" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1240" height="740" fill="#ffffff"/>
  <text x="620" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#222">UML-диаграмма классов (Class)</text>
  <g transform="translate(0,24)">

  <!-- ===== BookingsPage ===== -->
  <g>
    <rect x="30" y="60" width="360" height="228" fill="#fff" stroke="#333" stroke-width="1.6"/>
    <rect x="30" y="60" width="360" height="44" fill="#ece7f8" stroke="#333" stroke-width="1.6"/>
    <text x="210" y="77" text-anchor="middle" font-size="12.5" fill="#555">«страница»</text>
    <text x="210" y="96" text-anchor="middle" font-size="16" font-weight="700">BookingsPage</text>
    <line x1="30" y1="136" x2="390" y2="136" stroke="#333" stroke-width="1.2"/>
    <g font-family="Consolas, monospace" font-size="13.5" fill="#222">
      <text x="42" y="125">- editingId: string | null</text>
      <text x="42" y="157">+ initBookings(): void</text>
      <text x="42" y="177">+ onSubmit(event): void</text>
      <text x="42" y="197">+ startEdit(id): void</text>
      <text x="42" y="217">+ resetForm(): void</text>
      <text x="42" y="237">+ onRowAction(event): void</text>
      <text x="42" y="257">+ renderList(): void</text>
      <text x="42" y="277">+ getFilteredBookings(): Booking[]</text>
    </g>
  </g>

  <!-- ===== BookingValidator ===== -->
  <g>
    <rect x="440" y="60" width="360" height="168" fill="#fff" stroke="#333" stroke-width="1.6"/>
    <rect x="440" y="60" width="360" height="44" fill="#ece7f8" stroke="#333" stroke-width="1.6"/>
    <text x="620" y="77" text-anchor="middle" font-size="12.5" fill="#555">«модуль проверки»</text>
    <text x="620" y="96" text-anchor="middle" font-size="16" font-weight="700">BookingValidator</text>
    <line x1="440" y1="176" x2="800" y2="176" stroke="#333" stroke-width="1.2"/>
    <g font-family="Consolas, monospace" font-size="13.5" fill="#222">
      <text x="452" y="125">- NAME_PATTERN: RegExp</text>
      <text x="452" y="145">- WORK_START = "09:00"</text>
      <text x="452" y="165">- WORK_END = "21:00"</text>
      <text x="452" y="197">+ validateBooking(data, id): Errors</text>
      <text x="452" y="217">+ findConflict(data, id): Booking</text>
    </g>
  </g>

  <!-- ===== BookingStore ===== -->
  <g>
    <rect x="850" y="60" width="360" height="268" fill="#fff" stroke="#333" stroke-width="1.6"/>
    <rect x="850" y="60" width="360" height="44" fill="#ece7f8" stroke="#333" stroke-width="1.6"/>
    <text x="1030" y="77" text-anchor="middle" font-size="12.5" fill="#555">«хранилище, localStorage»</text>
    <text x="1030" y="96" text-anchor="middle" font-size="16" font-weight="700">BookingStore</text>
    <line x1="850" y1="156" x2="1210" y2="156" stroke="#333" stroke-width="1.2"/>
    <g font-family="Consolas, monospace" font-size="13.5" fill="#222">
      <text x="862" y="125">- KEY = "lavanda.bookings"</text>
      <text x="862" y="145">+ corrupted: boolean</text>
      <text x="862" y="177">+ load(): Booking[]</text>
      <text x="862" y="197">+ save(list: Booking[]): void</text>
      <text x="862" y="217">+ getAll(): Booking[]</text>
      <text x="862" y="237">+ getById(id): Booking | null</text>
      <text x="862" y="257">+ add(data): Booking</text>
      <text x="862" y="277">+ update(id, changes): Booking</text>
      <text x="862" y="297">+ remove(id): boolean</text>
      <text x="862" y="317">+ clear(): void</text>
    </g>
  </g>

  <!-- ===== Booking ===== -->
  <g>
    <rect x="440" y="400" width="360" height="272" fill="#fff" stroke="#333" stroke-width="1.6"/>
    <rect x="440" y="400" width="360" height="44" fill="#ddd3f5" stroke="#333" stroke-width="1.6"/>
    <text x="620" y="417" text-anchor="middle" font-size="12.5" fill="#555">«сущность»</text>
    <text x="620" y="436" text-anchor="middle" font-size="16" font-weight="700">Booking (Запись)</text>
    <line x1="440" y1="656" x2="800" y2="656" stroke="#333" stroke-width="1.2"/>
    <g font-family="Consolas, monospace" font-size="13.5" fill="#222">
      <text x="452" y="465">+ id: string</text>
      <text x="452" y="485">+ clientName: string</text>
      <text x="452" y="505">+ phone: string</text>
      <text x="452" y="525">+ serviceId: string</text>
      <text x="452" y="545">+ date: string     <tspan fill="#777">// ГГГГ-ММ-ДД</tspan></text>
      <text x="452" y="565">+ time: string     <tspan fill="#777">// ЧЧ:ММ</tspan></text>
      <text x="452" y="585">+ comment: string  <tspan fill="#777">// до 200</tspan></text>
      <text x="452" y="605">+ status: BookingStatus</text>
      <text x="452" y="625">+ createdAt: string</text>
      <text x="452" y="645">+ updatedAt: string</text>
    </g>
  </g>

  <!-- ===== DayTimeline (лента дня, изменение №3) ===== -->
  <g>
    <rect x="30" y="318" width="360" height="168" fill="#fff" stroke="#333" stroke-width="1.6"/>
    <rect x="30" y="318" width="360" height="44" fill="#ece7f8" stroke="#333" stroke-width="1.6"/>
    <text x="210" y="335" text-anchor="middle" font-size="12.5" fill="#555">«модуль ленты дня»</text>
    <text x="210" y="354" text-anchor="middle" font-size="16" font-weight="700">DayTimeline</text>
    <line x1="30" y1="394" x2="390" y2="394" stroke="#333" stroke-width="1.2"/>
    <g font-family="Consolas, monospace" font-size="13.5" fill="#222">
      <text x="42" y="383">- SLOT_STEP = 15 <tspan fill="#777">// мин</tspan></text>
      <text x="42" y="415">+ renderTimeline(container, date, opt)</text>
      <text x="42" y="435">+ slotAt(event, track, service, date)</text>
      <text x="42" y="455">+ pickInitialDay(): string</text>
      <text x="42" y="475">+ daySummary(date): string</text>
    </g>
  </g>

  <!-- ===== Service ===== -->
  <g>
    <rect x="30" y="510" width="320" height="172" fill="#fff" stroke="#333" stroke-width="1.6"/>
    <rect x="30" y="510" width="320" height="44" fill="#ddd3f5" stroke="#333" stroke-width="1.6"/>
    <text x="190" y="527" text-anchor="middle" font-size="12.5" fill="#555">«сущность»</text>
    <text x="190" y="546" text-anchor="middle" font-size="16" font-weight="700">Service (Услуга)</text>
    <line x1="30" y1="666" x2="350" y2="666" stroke="#333" stroke-width="1.2"/>
    <g font-family="Consolas, monospace" font-size="13.5" fill="#222">
      <text x="42" y="575">+ id: string</text>
      <text x="42" y="595">+ name: string</text>
      <text x="42" y="615">+ category: string</text>
      <text x="42" y="635">+ duration: number <tspan fill="#777">// мин</tspan></text>
      <text x="42" y="655">+ price: number    <tspan fill="#777">// ₸</tspan></text>
    </g>
  </g>

  <!-- ===== BookingStatus ===== -->
  <g>
    <rect x="890" y="440" width="320" height="116" fill="#fff" stroke="#333" stroke-width="1.6"/>
    <rect x="890" y="440" width="320" height="44" fill="#ece7f8" stroke="#333" stroke-width="1.6"/>
    <text x="1050" y="457" text-anchor="middle" font-size="12.5" fill="#555">«enumeration»</text>
    <text x="1050" y="476" text-anchor="middle" font-size="16" font-weight="700">BookingStatus</text>
    <g font-family="Consolas, monospace" font-size="13.5" fill="#222">
      <text x="902" y="505">planned   <tspan fill="#777">— Запланирована</tspan></text>
      <text x="902" y="525">done      <tspan fill="#777">— Выполнена</tspan></text>
      <text x="902" y="545">cancelled <tspan fill="#777">— Отменена</tspan></text>
    </g>
  </g>

  <!-- ===== Связи ===== -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <!-- зависимости «use» -->
    <line x1="390" y1="150" x2="438" y2="150" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="800" y1="150" x2="848" y2="150" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <polyline points="210,60 210,42 1030,42 1030,58" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <!-- агрегация: хранилище содержит записи -->
    <polygon points="1030,328 1037,339 1030,350 1023,339" fill="#fff"/>
    <polyline points="1030,350 1030,375 700,375 700,400"/>
    <!-- ассоциация Booking — Service -->
    <line x1="440" y1="600" x2="352" y2="600" marker-end="url(#open)"/>
    <!-- лента дня -->
    <line x1="210" y1="288" x2="210" y2="316" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <polyline points="390,340 900,340 900,330" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <!-- ассоциация Booking — BookingStatus -->
    <line x1="800" y1="500" x2="888" y2="500" marker-end="url(#open)"/>
  </g>
  <g font-size="13.5" fill="#333">
    <text x="414" y="142" text-anchor="middle" font-style="italic">«use»</text>
    <text x="824" y="142" text-anchor="middle" font-style="italic">«use»</text>
    <text x="620" y="36" text-anchor="middle" font-style="italic">«use»</text>
    <text x="1040" y="364">1</text>
    <text x="710" y="394">0..*</text>
    <text x="860" y="368" font-style="italic">хранит</text>
    <text x="408" y="592">0..*</text>
    <text x="360" y="592">1</text>
    <text x="396" y="621" text-anchor="middle" font-style="italic">serviceId</text>
    <text x="222" y="308" font-style="italic">«use»</text>
    <text x="645" y="333" text-anchor="middle" font-style="italic">«use»</text>
    <text x="844" y="492" text-anchor="middle" font-style="italic">status</text>
  </g>
  </g>
</svg>
